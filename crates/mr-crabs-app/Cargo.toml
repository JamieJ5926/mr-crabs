[package]
name = "mr-crabs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
phase-timing = [
    "mr-crabs-pty/phase-timing",
    "mr-crabs-terminal/phase-timing",
    "mr-crabs-element/phase-timing",
]

[[bin]]
name = "mr-crabs"
path = "src/bin/mr-crabs.rs"

[[bin]]
name = "phase-runner"
path = "src/bin/phase_runner.rs"

[dependencies]
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
mr-crabs-config = { path = "../mr-crabs-config" }
mr-crabs-element = { path = "../mr-crabs-element" }
mr-crabs-history.workspace = true
mr-crabs-input = { path = "../mr-crabs-input" }
mr-crabs-protocols.workspace = true
mr-crabs-pty = { path = "../mr-crabs-pty" }
mr-crabs-terminal.workspace = true
parking_lot.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2.5"

[dev-dependencies]
base64.workspace = true
gpui = { workspace = true, features = ["test-support"] }
