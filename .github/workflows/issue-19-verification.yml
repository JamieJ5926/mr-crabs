name: Issue 19 verification

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  run-red-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-19-text-animation-render-dedup
      - uses: dtolnay/rust-toolchain@stable
      - name: Run issue 19 regressions
        run: cargo test -p mr-crabs-effects --test issue_19_repeated_output
