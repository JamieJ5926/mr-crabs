name: Issue 19 verification

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  patch-and-test-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-19-text-animation-render-dedup
      - name: Align the existing model regression with issue 19
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/mr-crabs-effects/src/model.rs")
          source = path.read_text()
          start_marker = "    #[test]\n    fn unchanged_cells_never_restamp()"
          end_marker = "    #[test]\n    fn typewriter_stagger_across_rebuilds_via_model()"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''    #[test]
          fn repeated_identical_generation_restamps_only_drawable_glyphs() {
              let size = GridSize::new(4, 1);
              let mut m = model(TextAnimation::Streaming, 4, 1);
              let cursor = CursorState::default();
              let rows = vec![row(0, 1, &[65, 32, 32, 32])];
              let f = m.apply_frame(&frame_at(size, 1, rows, cursor), 1000, true);
              assert_eq!(f.revealing.len(), 4); // fresh tracker stamps all
              assert!(f.revealing.iter().all(|r| r.change_ms == 1000.0));

              // A new generation proves a fresh write cycle even when the
              // final cells are identical. Re-time the drawable glyph only;
              // spaces retain their previous stamps.
              let rows = vec![row(0, 2, &[65, 32, 32, 32])];
              let f = m.apply_frame(&frame_at(size, 2, rows, cursor), 1100, true);
              assert_eq!(f.revealing.len(), 4);
              assert!(f.revealing.iter().any(|reveal| {
                  reveal.pos == CellPos::new(0, 0) && reveal.change_ms == 1100.0
              }));
              assert!(
                  f.revealing
                      .iter()
                      .filter(|reveal| reveal.pos != CellPos::new(0, 0))
                      .all(|reveal| reveal.change_ms == 1000.0)
              );
          }

          '''
          path.write_text(source[:start] + replacement + source[end:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/mr-crabs-effects/src/model.rs
          git commit -m "test: align repeated output model expectations"
          git push origin HEAD:fix/issue-19-text-animation-render-dedup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint effects crate
        run: cargo clippy -p mr-crabs-effects --all-targets -- -D warnings
      - name: Run effects tests
        run: cargo test -p mr-crabs-effects
