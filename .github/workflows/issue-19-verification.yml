name: Issue 19 verification

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  verify-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint effects crate
        run: cargo clippy -p mr-crabs-effects --all-targets -- -D warnings
      - name: Run effects tests
        run: cargo test -p mr-crabs-effects
