name: Issue 19 verification

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  align-bypass-contract-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-19-text-animation-render-dedup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Align retained-reveal paint expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/mr-crabs-effects/tests/issue_19_repeated_output.rs")
          source = path.read_text()
          old = "    assert!(!effect.text_reveal_allowed);"
          count = source.count(old)
          if count == 2:
              source = source.replace(
                  old,
                  "    assert!(effect.text_reveal_allowed);",
              )
              path.write_text(source)
          elif count != 0:
              raise SystemExit(f"expected 0 or 2 stale assertions, found {count}")
          PY
      - name: Format changes
        run: cargo fmt --all
      - name: Commit regression update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Bypass regressions already aligned"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/mr-crabs-effects/tests/issue_19_repeated_output.rs
            git commit -m "test: assert retained reveals remain paintable"
            git push origin HEAD:fix/issue-19-text-animation-render-dedup
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint changed crate
        run: cargo clippy -p mr-crabs-effects --all-targets --no-deps -- -D warnings
      - name: Run effects tests
        run: cargo test -p mr-crabs-effects
